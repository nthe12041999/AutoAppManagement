services:
  api:
    container_name: autoapp-api
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      # Connection string từ appsettings.Production.json
      - ConnectionStrings__DefaultConnection=Data Source=125.253.121.206,1433;Initial Catalog=AutoAppManagement;Persist Security Info=True;User ID=sa;Password=Nguyenthe@99;Pooling=False;Multiple Active Result Sets=False;Encrypt=True;Trust Server Certificate=True;Command Timeout=0
      # JWT Configuration
      - Jwt__SecretKey=AutoAppManagement_Production_Secret_Key_2024_Very_Long_Secret_Key_For_Security_tlsoftware
      - Jwt__Issuer=tlsoftware.io.vn
      - Jwt__Audience=AutoAppManagement.Client
      - Jwt__ExpiryMinutes=1440
      # App Settings - Temporary use localhost for testing
      - AppSettings__BaseUrl=http://localhost:8081
      - AppSettings__ApiBaseUrl=http://localhost:8080/api
      - AppSettings__Environment=Development
      - AppSettings__EnableSwagger=true
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - autoapp-network

  webapp:
    container_name: autoapp-webapp
    build:
      context: .
      dockerfile: docker/webapp.Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      # API URL để webapp có thể gọi API
      - AppSettings__ApiBaseUrl=http://api:8080/api
      - AppSettings__BaseUrl=http://localhost:8081
      - AppSettings__Environment=Development
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - autoapp-network

networks:
  autoapp-network:
    driver: bridge
