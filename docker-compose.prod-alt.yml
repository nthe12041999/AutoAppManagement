version: '3.8'

services:
  # SQL Server Database với port alternative
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: autoapp_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=AutoApp@Production@2024
      - MSSQL_PID=Express
    ports:
      - "14330:1433"  # Map to different external port
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./Database/Scripts:/scripts
    networks:
      - autoapp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P AutoApp@Production@2024 -Q 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Web Application
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoapp_webapp
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - autoapp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Application  
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: autoapp_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
    ports:
      - "8081:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - autoapp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: autoapp_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    depends_on:
      - webapp
      - api
    networks:
      - autoapp-network
    restart: unless-stopped

networks:
  autoapp-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
  nginx_logs:
    driver: local
