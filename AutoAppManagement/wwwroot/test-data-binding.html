<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Data Binding</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="css/form-styles.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Test Data Binding System</h2>
        
        <!-- Test DataGrid -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>Test DataGrid với Mock Data</h5>
            </div>
            <div class="card-body">
                <div data-component="data-grid"
                     data-container-id="testAccountGrid"
                     data-entity="Customer"
                     data-entity-plural="Customers"
                     data-title-grid="Danh sách tài khoản test"
                     data-get-url="/Account/GetPaging"
                     data-detail-form="CustomerForms"
                     data-has-add="true"
                     data-has-refresh="true"
                     data-page-size="5">
                </div>
            </div>
        </div>

        <!-- Debug Info -->
        <div class="card">
            <div class="card-header">
                <h5>Debug Information</h5>
            </div>
            <div class="card-body">
                <div id="debugInfo">
                    <p><strong>Status:</strong> <span id="status">Initializing...</span></p>
                    <p><strong>jQuery:</strong> <span id="jqueryStatus">Checking...</span></p>
                    <p><strong>DataGrid:</strong> <span id="datagridStatus">Checking...</span></p>
                    <p><strong>FetchAPI:</strong> <span id="fetchapiStatus">Checking...</span></p>
                    <p><strong>FormControlBinder:</strong> <span id="binderStatus">Checking...</span></p>
                </div>
                
                <!-- Test Buttons -->
                <div class="mt-3">
                    <button class="btn btn-primary" onclick="testGetById(1)">Test GetById(1)</button>
                    <button class="btn btn-secondary" onclick="testGetPaging()">Test GetPaging</button>
                    <button class="btn btn-info" onclick="testModalLoad()">Test Modal Load</button>
                </div>
                
                <!-- Console Output -->
                <div class="mt-3">
                    <h6>Console Output:</h6>
                    <div id="consoleOutput" class="border p-2" style="height: 200px; overflow-y: auto; background: #f8f9fa; font-family: monospace; font-size: 12px;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/enums/column-types.js"></script>
    <script src="js/fetch-api.js"></script>
    <script src="js/form-control-binder.js"></script>
    <script src="js/components/data-grid.js"></script>
    <script src="js/utils/form-helpers.js"></script>
    <script src="js/pages/account/account-grid.js"></script>
    <script src="js/pages/account/account-detail.js"></script>

    <script>
        // Capture console logs
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        function addToConsole(type, ...args) {
            const output = document.getElementById('consoleOutput');
            const time = new Date().toLocaleTimeString();
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : arg
            ).join(' ');
            
            const color = type === 'error' ? 'text-danger' : 
                         type === 'warn' ? 'text-warning' : 
                         'text-dark';
            
            output.innerHTML += `<div class="${color}">[${time}] ${type.toUpperCase()}: ${message}</div>`;
            output.scrollTop = output.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addToConsole('log', ...args);
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addToConsole('error', ...args);
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            addToConsole('warn', ...args);
        };

        // Check dependencies
        $(document).ready(function() {
            $('#status').text('Document Ready');
            $('#jqueryStatus').text(typeof $ !== 'undefined' ? 'Loaded ✓' : 'Not Found ✗');
            $('#datagridStatus').text(typeof window.DataGrid !== 'undefined' ? 'Loaded ✓' : 'Not Found ✗');
            $('#fetchapiStatus').text(typeof calGetAPIAuthen !== 'undefined' ? 'Loaded ✓' : 'Not Found ✗');
            $('#binderStatus').text(typeof window.formControlBinder !== 'undefined' ? 'Loaded ✓' : 'Not Found ✗');
            
            console.log('Test page initialized');
            console.log('DataGrid instance:', window.dataGridInstance);
        });

        // Test functions
        function testGetById(id) {
            console.log('Testing GetById for ID:', id);
            
            if (typeof calGetAPIAuthen === 'undefined') {
                console.error('calGetAPIAuthen not available');
                return;
            }
            
            calGetAPIAuthen('/Account/GetById/' + id, {},
                (response) => {
                    console.log('GetById Success:', response);
                },
                (error) => {
                    console.error('GetById Error:', error);
                }
            );
        }
        
        function testGetPaging() {
            console.log('Testing GetPaging');
            
            calGetAPIAuthen('/Account/GetPaging', { page: 1, pageSize: 5 },
                (response) => {
                    console.log('GetPaging Success:', response);
                },
                (error) => {
                    console.error('GetPaging Error:', error);
                }
            );
        }
        
        function testModalLoad() {
            console.log('Testing Modal Load');
            
            if (window.dataGridInstance) {
                const config = {
                    containerId: 'testAccountGrid',
                    entity: 'Customer',
                    detailForm: 'CustomerForms'
                };
                
                window.dataGridInstance.loadDetailFormModal(config, 'view', 1);
            } else {
                console.error('DataGrid instance not available');
            }
        }
    </script>
</body>
</html>
