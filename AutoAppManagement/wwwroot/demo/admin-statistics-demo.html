<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Admin Statistics</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8f9fa;
        }
        .stats-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .stats-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .demo-section {
            margin-bottom: 3rem;
        }
        .section-title {
            border-left: 4px solid #0d6efd;
            padding-left: 1rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">Demo Admin Statistics Cards</h1>
                <p class="text-muted mb-5">Ví dụ về cách sử dụng StatisticsCards component với template admin</p>
                
                <!-- Demo 1: Template Admin mặc định -->
                <div class="demo-section">
                    <h3 class="section-title">1. Template Admin Mặc Định</h3>
                    <div id="adminStatistics" data-component="statistics" data-template="admin">
                        <!-- Cards sẽ được tự động tạo -->
                    </div>
                    <button class="btn btn-primary" onclick="updateDefaultAdminStats()">
                        <i class="bi bi-arrow-clockwise me-2"></i>Cập nhật dữ liệu mẫu
                    </button>
                </div>

                <!-- Demo 2: Admin Statistics tùy chỉnh -->
                <div class="demo-section">
                    <h3 class="section-title">2. Admin Statistics Tùy Chỉnh</h3>
                    <div id="customAdminStats"></div>
                    <button class="btn btn-success" onclick="updateCustomAdminStats()">
                        <i class="bi bi-gear me-2"></i>Cập nhật thống kê tùy chỉnh
                    </button>
                </div>

                <!-- Demo 3: Thống kê bảo mật -->
                <div class="demo-section">
                    <h3 class="section-title">3. Thống Kê Bảo Mật</h3>
                    <div id="securityStats"></div>
                    <button class="btn btn-warning" onclick="updateSecurityStats()">
                        <i class="bi bi-shield-check me-2"></i>Cập nhật bảo mật
                    </button>
                </div>

                <!-- Demo 4: Thống kê hệ thống -->
                <div class="demo-section">
                    <h3 class="section-title">4. Thống Kê Hệ Thống</h3>
                    <div id="systemStats"></div>
                    <button class="btn btn-info" onclick="updateSystemStats()">
                        <i class="bi bi-cpu me-2"></i>Cập nhật hệ thống
                    </button>
                </div>

                <!-- Demo 5: Thống kê động -->
                <div class="demo-section">
                    <h3 class="section-title">5. Thống Kê Động (Realtime)</h3>
                    <div id="realtimeStats"></div>
                    <div class="mt-3">
                        <button class="btn btn-success" onclick="startRealtime()">
                            <i class="bi bi-play me-2"></i>Bắt đầu cập nhật realtime
                        </button>
                        <button class="btn btn-danger" onclick="stopRealtime()">
                            <i class="bi bi-stop me-2"></i>Dừng cập nhật
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Include StatisticsCards component -->
    <script src="../js/components/statistics-cards.js"></script>
    
    <script>
        let realtimeInterval;

        // Khởi tạo các demo khi trang load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Initializing Admin Statistics Demo...');
            
            // Demo 2: Custom Admin Stats
            window.customAdminStatsStats = new StatisticsCards('customAdminStats');
            window.customAdminStatsStats.setCards([
                {
                    id: 'totalAdmins',
                    title: 'Tổng Admin',
                    value: 0,
                    icon: 'bi bi-people-fill',
                    color: 'primary',
                    colSize: 'col-xl-3 col-md-6'
                },
                {
                    id: 'superAdmins',
                    title: 'Super Admin',
                    value: 0,
                    icon: 'bi bi-shield-fill-check',
                    color: 'danger',
                    colSize: 'col-xl-3 col-md-6'
                },
                {
                    id: 'moderators',
                    title: 'Moderator',
                    value: 0,
                    icon: 'bi bi-person-badge',
                    color: 'warning',
                    colSize: 'col-xl-3 col-md-6'
                },
                {
                    id: 'activeToday',
                    title: 'Hoạt động hôm nay',
                    value: 0,
                    icon: 'bi bi-activity',
                    color: 'success',
                    colSize: 'col-xl-3 col-md-6'
                }
            ]);

            // Demo 3: Security Stats
            window.securityStatsStats = new StatisticsCards('securityStats');
            window.securityStatsStats.setCards([
                {
                    id: 'loginAttempts',
                    title: 'Lần đăng nhập hôm nay',
                    value: 0,
                    icon: 'bi bi-door-open',
                    color: 'primary'
                },
                {
                    id: 'failedLogins',
                    title: 'Đăng nhập thất bại',
                    value: 0,
                    icon: 'bi bi-shield-x',
                    color: 'danger'
                },
                {
                    id: 'blockedIPs',
                    title: 'IP bị chặn',
                    value: 0,
                    icon: 'bi bi-ban',
                    color: 'warning'
                },
                {
                    id: 'securityAlerts',
                    title: 'Cảnh báo bảo mật',
                    value: 0,
                    icon: 'bi bi-exclamation-triangle',
                    color: 'info'
                }
            ]);

            // Demo 4: System Stats
            window.systemStatsStats = new StatisticsCards('systemStats');
            window.systemStatsStats.setCards([
                {
                    id: 'systemHealth',
                    title: 'Tình trạng hệ thống',
                    value: '99.9%',
                    icon: 'bi bi-heart-pulse',
                    color: 'success',
                    colSize: 'col-lg-4'
                },
                {
                    id: 'serverLoad',
                    title: 'Tải server',
                    value: '45%',
                    icon: 'bi bi-cpu',
                    color: 'info',
                    colSize: 'col-lg-4'
                },
                {
                    id: 'memoryUsage',
                    title: 'Sử dụng RAM',
                    value: '2.1GB',
                    icon: 'bi bi-memory',
                    color: 'warning',
                    colSize: 'col-lg-4'
                }
            ]);

            // Demo 5: Realtime Stats
            window.realtimeStatsStats = new StatisticsCards('realtimeStats');
            window.realtimeStatsStats.setCards([
                {
                    id: 'currentUsers',
                    title: 'Người dùng hiện tại',
                    value: 0,
                    icon: 'bi bi-people',
                    color: 'primary'
                },
                {
                    id: 'requestsPerSecond',
                    title: 'Requests/giây',
                    value: 0,
                    icon: 'bi bi-speedometer2',
                    color: 'success'
                },
                {
                    id: 'responseTime',
                    title: 'Thời gian phản hồi',
                    value: '0ms',
                    icon: 'bi bi-clock',
                    color: 'info'
                },
                {
                    id: 'errorRate',
                    title: 'Tỷ lệ lỗi',
                    value: '0%',
                    icon: 'bi bi-exclamation-circle',
                    color: 'warning'
                }
            ]);

            console.log('✅ Admin Statistics Demo initialized');
        });

        // Các hàm cập nhật dữ liệu mẫu
        function updateDefaultAdminStats() {
            if (window.adminStatisticsStats) {
                window.adminStatisticsStats.updateValues({
                    totalAdmins: Math.floor(Math.random() * 50) + 10,
                    activeAdmins: Math.floor(Math.random() * 30) + 5,
                    verifiedAdmins: Math.floor(Math.random() * 25) + 8,
                    onlineAdmins: Math.floor(Math.random() * 15) + 2
                });
            }
        }

        function updateCustomAdminStats() {
            if (window.customAdminStatsStats) {
                window.customAdminStatsStats.updateValues({
                    totalAdmins: Math.floor(Math.random() * 100) + 20,
                    superAdmins: Math.floor(Math.random() * 5) + 1,
                    moderators: Math.floor(Math.random() * 15) + 3,
                    activeToday: Math.floor(Math.random() * 25) + 5
                });
            }
        }

        function updateSecurityStats() {
            if (window.securityStatsStats) {
                window.securityStatsStats.updateValues({
                    loginAttempts: Math.floor(Math.random() * 500) + 100,
                    failedLogins: Math.floor(Math.random() * 20) + 2,
                    blockedIPs: Math.floor(Math.random() * 10) + 1,
                    securityAlerts: Math.floor(Math.random() * 5)
                });
            }
        }

        function updateSystemStats() {
            if (window.systemStatsStats) {
                const health = (Math.random() * 5 + 95).toFixed(1) + '%';
                const load = Math.floor(Math.random() * 40 + 20) + '%';
                const memory = (Math.random() * 2 + 1).toFixed(1) + 'GB';
                
                window.systemStatsStats.updateValues({
                    systemHealth: health,
                    serverLoad: load,
                    memoryUsage: memory
                });
            }
        }

        function startRealtime() {
            if (realtimeInterval) clearInterval(realtimeInterval);
            
            realtimeInterval = setInterval(() => {
                if (window.realtimeStatsStats) {
                    window.realtimeStatsStats.updateValues({
                        currentUsers: Math.floor(Math.random() * 1000) + 100,
                        requestsPerSecond: Math.floor(Math.random() * 100) + 10,
                        responseTime: Math.floor(Math.random() * 200) + 50 + 'ms',
                        errorRate: (Math.random() * 2).toFixed(2) + '%'
                    });
                }
            }, 2000);
        }

        function stopRealtime() {
            if (realtimeInterval) {
                clearInterval(realtimeInterval);
                realtimeInterval = null;
            }
        }
    </script>
</body>
</html>
