version: '3.8'

services:
  # Web Application
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoapp_webapp
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
    ports:
      - "8080:8080"
    networks:
      - autoapp-network
    restart: unless-stopped

  # API Application  
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: autoapp_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
    ports:
      - "8081:8080"
    networks:
      - autoapp-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: autoapp_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - webapp
      - api
    networks:
      - autoapp-network
    restart: unless-stopped

networks:
  autoapp-network:
    driver: bridge
