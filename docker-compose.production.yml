version: '3.8'

services:
  api:
    container_name: autoapp-api-prod
    build:
      context: .
      dockerfile: api.Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Data Source=125.253.121.206,1433;Initial Catalog=AutoAppManagement;Persist Security Info=True;User ID=sa;Password=Nguyenthe@99;Pooling=False;Multiple Active Result Sets=False;Encrypt=True;Trust Server Certificate=True;Command Timeout=0
      - ConnectionStrings__SqlConnection=Data Source=125.253.121.206,1433;Initial Catalog=AutoAppManagement;Persist Security Info=True;User ID=sa;Password=Nguyenthe@99;Pooling=False;Multiple Active Result Sets=False;Encrypt=True;Trust Server Certificate=True;Command Timeout=0
      - Jwt__SecretKey=AutoAppManagement_Production_Secret_Key_2024_Very_Long_Secret_Key_For_Security_tlsoftware
      - Jwt__Issuer=tlsoftware.io.vn
      - Jwt__Audience=AutoAppManagement.Client
      - Jwt__ExpiryMinutes=1440
      - AppSettings__BaseUrl=http://tlsoftware.io.vn
      - AppSettings__ApiBaseUrl=http://tlsoftware.io.vn/api
      - AppSettings__Environment=Production
      - AppSettings__EnableSwagger=false
      # CORS Configuration
      - CORS__AllowedOrigins__0=http://tlsoftware.io.vn
      - CORS__AllowedOrigins__1=https://tlsoftware.io.vn
    ports:
      - "8081:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    networks:
      - autoapp-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  webapp:
    container_name: autoapp-webapp-prod
    build:
      context: .
      dockerfile: webapp.Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - AppSettings__ApiBaseUrl=http://api/api
      - AppSettings__BaseUrl=http://tlsoftware.io.vn
      - AppSettings__Environment=Production
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - autoapp-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  autoapp-network:
    driver: bridge